# ===== ADMIN COMMANDS =====
@bot.command(name="role")
async def role(ctx, action: str = None, member: discord.Member = None, *, role_name: str = None):
    if not is_admin(ctx.author.id):
        await ctx.send("❌ Bạn không có quyền admin.")
        return
    if action is None or member is None or role_name is None:
        await ctx.send("❌ Cách dùng: `?role add @user <tên_role>` hoặc `?role remove @user <tên_role>`")
        return
    if not ctx.guild.me.guild_permissions.manage_roles:
        await ctx.send("❌ Bot cần quyền Quản lý role.")
        return
    action = action.lower()
    if action not in ['add', 'remove']:
        await ctx.send("❌ Hành động không hợp lệ. Dùng `add` hoặc `remove`.")
        return
    role = discord.utils.get(ctx.guild.roles, name=role_name)
    if not role:
        for r in ctx.guild.roles:
            if r.name.lower() == role_name.lower():
                role = r
                break
    if not role:
        await ctx.send(f"❌ Không tìm thấy role **{role_name}** trong server.")
        return
    if role.position >= ctx.guild.me.top_role.position:
        await ctx.send("❌ Bot không có quyền chỉnh sửa role này.")
        return
    try:
        if action == 'add':
            await member.add_roles(role, reason=f"Bởi {ctx.author} (admin)")
            await ctx.send(f"✅ Đã thêm role **{role.name}** cho {member.mention}")
        else:
            if role not in member.roles:
                await ctx.send(f"❌ {member.mention} không có role **{role.name}**")
                return
            await member.remove_roles(role, reason=f"Bởi {ctx.author} (admin)")
            await ctx.send(f"✅ Đã gỡ role **{role.name}** khỏi {member.mention}")
    except discord.Forbidden:
        await ctx.send("❌ Bot thiếu quyền hoặc role không hợp lệ.")
    except Exception as e:
        await ctx.send(f"❌ Lỗi: {e}")

@bot.command(name="kick")
async def kick(ctx, member: discord.Member = None, *, reason: str = "Không có lý do"):
    if not is_admin(ctx.author.id):
        await ctx.send("❌ Bạn không có quyền admin.")
        return
    if member is None:
        await ctx.send("❌ Cách dùng: `?kick @user [lý do]`")
        return
    if not ctx.guild.me.guild_permissions.kick_members:
        await ctx.send("❌ Bot cần quyền Kick thành viên.")
        return
    if member.top_role.position >= ctx.guild.me.top_role.position:
        await ctx.send("❌ Bot không thể kick người này (role cao hơn).")
        return
    try:
        await member.kick(reason=f"{reason} (bởi {ctx.author})")
        await ctx.send(f"👢 Đã kick {member.mention} với lý do: {reason}")
    except discord.Forbidden:
        await ctx.send("❌ Bot thiếu quyền để kick thành viên này.")
    except Exception as e:
        await ctx.send(f"❌ Lỗi: {e}")

