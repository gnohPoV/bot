@bot.command(name="taixiu")
async def tai_xiu(ctx, cuoc: str = None):
    """Tài xỉu (đoán tổng 3 viên xúc xắc)"""
    data = load_data()
    user_id = str(ctx.author.id)
    
    if user_id not in data:
        await ctx.send("❌ Bạn chưa đăng ký tài khoản! Dùng `?dangkytk` để đăng ký.")
        return
    
    if cuoc is None or cuoc.lower() not in ["tai", "xiu"]:
        await ctx.send("❌ Cách dùng: `?taixiu <tai/xiu>`\nVí dụ: `?taixiu tai`")
        return
    
    # Random 3 viên xúc xắc (1-6)
    dice1 = random.randint(1, 6)
    dice2 = random.randint(1, 6)
    dice3 = random.randint(1, 6)
    total = dice1 + dice2 + dice3
    result = "tai" if total >= 11 else "xiu"
    
    if cuoc.lower() == result:
        reward = 100000
        data[user_id]["balance"] += reward
        msg = f"🎉 **Bạn thắng!** Nhận {reward:,} VND"
    else:
        data[user_id]["balance"] -= 50000
        msg = f"😅 **Bạn thua!** Mất 50,000 VND"
    
    data[user_id]["games_played"] = data[user_id].get("games_played", 0) + 1
    save_data(data)
    
    await ctx.send(
        f"**🎲 TÀI XỈU**\n"
        f"Xúc xắc: [{dice1}] [{dice2}] [{dice3}]\n"
        f"Tổng: {total} - {'TÀI' if total >= 11 else 'XỈU'}\n"
        f"Bạn đặt: **{cuoc.upper()}**\n"
        f"**{msg}**"
    )

