@bot.command(name="xizach")
async def xizach(ctx, bet: int = None):
    if bet is None:
        await ctx.send("❌ Cách dùng: `?xizach <số tiền cược>`")
        return
    player = get_player(ctx.author.id)
    balance = player.get("balance", 0)
    if bet < 1000:
        await ctx.send("❌ Cược tối thiểu **1,000 VNĐ**")
        return
    if bet > balance:
        await ctx.send(f"❌ Không đủ tiền! Số dư: **{format(balance, ',')} VNĐ**")
        return
    player_hand = [random_card(), random_card()]
    bot_hand = [random_card(), random_card()]
    while hand_value(bot_hand) < 17:
        bot_hand.append(random_card())
    if hand_value(player_hand) < 16:
        player_hand.append(random_card())
    p_val = hand_value(player_hand)
    b_val = hand_value(bot_hand)
    player["balance"] -= bet
    if p_val > 21:
        update_player(ctx.author.id, "balance", player["balance"])
        await ctx.send(f"🃏 Bài của bạn: {' '.join(player_hand)} (Điểm: {p_val})\n🃏 Bài của bot: {' '.join(bot_hand)} (Điểm: {b_val})\n💔 Bạn quắc! Mất **{format(bet, ',')} VNĐ**")
    elif b_val > 21 or p_val > b_val:
        win = bet * 2
        player["balance"] += win
        update_player(ctx.author.id, "balance", player["balance"])
        await ctx.send(f"🃏 Bài của bạn: {' '.join(player_hand)} (Điểm: {p_val})\n🃏 Bài của bot: {' '.join(bot_hand)} (Điểm: {b_val})\n🎉 Bạn thắng! Nhận **{format(win, ',')} VNĐ**")
    elif p_val < b_val:
        update_player(ctx.author.id, "balance", player["balance"])
        await ctx.send(f"🃏 Bài của bạn: {' '.join(player_hand)} (Điểm: {p_val})\n🃏 Bài của bot: {' '.join(bot_hand)} (Điểm: {b_val})\n💔 Bạn thua! Mất **{format(bet, ',')} VNĐ**")
    else:
        player["balance"] += bet
        update_player(ctx.author.id, "balance", player["balance"])
        await ctx.send(f"🃏 Bài của bạn: {' '.join(player_hand)} (Điểm: {p_val})\n🃏 Bài của bot: {' '.join(bot_hand)} (Điểm: {b_val})\n🤝 Hòa! Hoàn lại tiền.")

