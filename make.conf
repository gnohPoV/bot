# ===== LỆNH PREFIX TÙY CHỈNH (CHO MỌI NGƯỜI) =====
@bot.command(name="setprefix")
async def set_prefix(ctx, new_prefix: str = None):
    """Đặt prefix riêng cho bản thân (ai cũng có thể dùng)."""
    if new_prefix is None:
        current = CUSTOM_PREFIXES.get(str(ctx.author.id), DEFAULT_PREFIX)
        await ctx.send(f"🔹 Prefix hiện tại của bạn: `{current}`")
        return

    if len(new_prefix) > 5:
        await ctx.send("❌ Prefix quá dài (tối đa 5 ký tự).")
        return
    if ' ' in new_prefix:
        await ctx.send("❌ Prefix không được chứa khoảng trắng.")
        return

    user_id = str(ctx.author.id)
    if new_prefix == DEFAULT_PREFIX:
        if user_id in CUSTOM_PREFIXES:
            del CUSTOM_PREFIXES[user_id]
    else:
        CUSTOM_PREFIXES[user_id] = new_prefix

    config["custom_prefixes"] = CUSTOM_PREFIXES
    save_config()

    await ctx.send(f"✅ Đã đặt prefix của bạn thành `{new_prefix}`")

@bot.command(name="showprefixes")
async def show_prefixes(ctx):
    """Hiển thị danh sách tất cả custom prefix (ai cũng có thể xem)."""
    if not CUSTOM_PREFIXES:
        await ctx.send("📭 Không có custom prefix nào.")
        return
    msg = "📋 **Danh sách prefix tùy chỉnh:**\n"
    for uid, pref in CUSTOM_PREFIXES.items():
        user = bot.get_user(int(uid))
        name = user.name if user else "Unknown"
        msg += f"`{pref}` - {name}\n"
    await ctx.send(msg)

