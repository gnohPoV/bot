@bot.command(name="daily")
async def daily(ctx):
    player = get_player(ctx.author.id)
    last = player.get("last_daily")
    now = datetime.now()
    if last:
        last_time = datetime.fromisoformat(last)
        if (now - last_time) < timedelta(days=1):
            remaining = timedelta(days=1) - (now - last_time)
            hours = remaining.seconds // 3600
            minutes = (remaining.seconds % 3600) // 60
            await ctx.send(f"⏳ Bạn đã nhận daily hôm nay rồi! Vui lòng quay lại sau **{hours}h{minutes}phút**.")
            return
    reward = random.randint(100000, 500000)
    new_balance = player.get("balance", 0) + reward
    player["balance"] = new_balance
    player["last_daily"] = now.isoformat()
    update_player(ctx.author.id, "balance", new_balance)
    update_player(ctx.author.id, "last_daily", now.isoformat())
    await ctx.send(f"🎁 Điểm danh thành công! Bạn nhận được **{format(reward, ',')} VNĐ**.\n💰 Số dư hiện tại: **{format(new_balance, ',')} VNĐ**")

@bot.command(name="vqmm")
async def vqmm(ctx):
    player = get_player(ctx.author.id)
    balance = player.get("balance", 0)
    if balance < 1000:
        await ctx.send("❌ Bạn cần ít nhất **1,000 VNĐ** để quay!")
        return
    player["balance"] = balance - 1000
    update_player(ctx.author.id, "balance", player["balance"])
    reward = random.randint(0, 500000)
    if reward <= 1000:
        reward = 0
    elif reward < 10000:
        reward = random.choice([1000, 2000, 5000])
    else:
        reward = random.randint(10000, 500000)
    player["balance"] += reward
    update_player(ctx.author.id, "balance", player["balance"])
    await ctx.send(f"🎰 Vòng quay may mắn!\nBạn quay được **{format(reward, ',')} VNĐ**!\n💰 Số dư mới: **{format(player['balance'], ',')} VNĐ**")

@bot.command(name="taixiu")
async def taixiu(ctx, bet: int = None, choice: str = None):
    if bet is None or choice is None:
        await ctx.send("❌ Cách dùng: `?taixiu <số tiền> <tài/xỉu>`\nVí dụ: `?taixiu 50000 tài`")
        return
    player = get_player(ctx.author.id)
    balance = player.get("balance", 0)
    if bet < 1000:
        await ctx.send("❌ Số tiền cược tối thiểu là **1,000 VNĐ**")
        return
    if bet > balance:
        await ctx.send(f"❌ Bạn không có đủ tiền! Số dư: **{format(balance, ',')} VNĐ**")
        return
    choice = choice.lower()
    if choice not in ["tài", "xỉu"]:
        await ctx.send("❌ Chỉ chọn **tài** hoặc **xỉu**")
        return
    dice1 = random.randint(1, 6)
    dice2 = random.randint(1, 6)
    dice3 = random.randint(1, 6)
    total = dice1 + dice2 + dice3
    result = "tài" if total >= 11 else "xỉu"
    if result == choice:
        win = bet
        player["balance"] += win
        update_player(ctx.author.id, "balance", player["balance"])
        await ctx.send(f"🎲 Xúc xắc: {dice1} - {dice2} - {dice3} (Tổng: {total})\n🟢 **{result.upper()}**! Bạn thắng **{format(win, ',')} VNĐ**!\n💰 Số dư mới: **{format(player['balance'], ',')} VNĐ**")
    else:
        player["balance"] -= bet
        update_player(ctx.author.id, "balance", player["balance"])
        await ctx.send(f"🎲 Xúc xắc: {dice1} - {dice2} - {dice3} (Tổng: {total})\n🔴 **{result.upper()}**! Bạn thua **{format(bet, ',')} VNĐ**.\n💰 Số dư còn lại: **{format(player['balance'], ',')} VNĐ**")

@bot.command(name="baicao")
async def baicao(ctx, bet: int = None):
    if bet is None:
        await ctx.send("❌ Cách dùng: `?baicao <số tiền cược>`\nVí dụ: `?baicao 10000`")
        return
    player = get_player(ctx.author.id)
    balance = player.get("balance", 0)
    if bet < 1000:
        await ctx.send("❌ Cược tối thiểu **1,000 VNĐ**")
        return
    if bet > balance:
        await ctx.send(f"❌ Không đủ tiền! Số dư: **{format(balance, ',')} VNĐ**")
        return
    player_hand = [random_card() for _ in range(3)]
    bot_hand = [random_card() for _ in range(3)]
    p_score = sum(card_value(c) for c in player_hand) % 10
    b_score = sum(card_value(c) for c in bot_hand) % 10
    player["balance"] -= bet
    if p_score > b_score:
        win = bet * 2
        player["balance"] += win
        update_player(ctx.author.id, "balance", player["balance"])
