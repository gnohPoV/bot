# ===== PERMISSION SYSTEM =====
PERMISSIONS_FILE = "permissions.json"
DEFAULT_PERMISSIONS = {}

def load_permissions():
    if os.path.exists(PERMISSIONS_FILE):
        with open(PERMISSIONS_FILE, 'r', encoding='utf-8') as f:
            return json.load(f)
    return DEFAULT_PERMISSIONS.copy()

def save_permissions(perms):
    with open(PERMISSIONS_FILE, 'w', encoding='utf-8') as f:
        json.dump(perms, f, indent=2, ensure_ascii=False)

def has_permission(user_id, command_name):
    user_id = str(user_id)
    if int(user_id) in ADMIN_IDS:
        return True
    perms = load_permissions()
    user_perms = perms.get(user_id, [])
    return command_name in user_perms or "everything" in user_perms

def add_permission(user_id, command_name):
    perms = load_permissions()
    user_id = str(user_id)
    if user_id not in perms:
        perms[user_id] = []
    if command_name not in perms[user_id]:
        perms[user_id].append(command_name)
    save_permissions(perms)

def remove_permission(user_id, command_name):
    perms = load_permissions()
    user_id = str(user_id)
    if user_id in perms and command_name in perms[user_id]:
        perms[user_id].remove(command_name)
        if not perms[user_id]:
            del perms[user_id]
        save_permissions(perms)

def is_admin(user_id):
    return user_id in ADMIN_IDS

