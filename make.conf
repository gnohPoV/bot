import discord
from discord.ext import commands
import random
import json
import os
from datetime import datetime, timedelta

# ===== CONFIG =====
PREFIX = "?"
TOKEN = "YOUR_BOT_TOKEN_HERE"  # Thay bằng token của bạn

# ===== INIT =====
intents = discord.Intents.default()
intents.message_content = True
bot = commands.Bot(command_prefix=PREFIX, intents=intents)

# File lưu dữ liệu
DATA_FILE = "user_data.json"

# Load data
def load_data():
    if os.path.exists(DATA_FILE):
        with open(DATA_FILE, 'r', encoding='utf-8') as f:
            return json.load(f)
    return {}

def save_data(data):
    with open(DATA_FILE, 'w', encoding='utf-8') as f:
        json.dump(data, f, indent=2, ensure_ascii=False)

# ===== GAME FUNCTIONS =====
def tinh_diem_bai_cao(bai):
    """Tính điểm bài cào (3 lá)"""
    tong = sum(min(10, x) for x in bai) % 10
    return tong if tong != 0 else 10  # 10 là 10 điểm (cao nhất)

def tinh_diem_xizach(bai):
    """Tính điểm xì dách (gần 21 nhất)"""
    tong = sum(bai)
    if tong <= 21:
        return tong
    # Nếu có quân Át (11), đổi thành 1
    if 11 in bai:
        tong -= 10
    if tong <= 21:
        return tong
    return tong

def tao_bai():
    """Tạo bộ bài 52 lá (giá trị từ 1-13)"""
    return random.sample(range(1, 14), 3)

def so_sanh_tl(bai1, bai2):
    """So sánh bài tiến lên (đơn giản: tổng điểm)"""
    return sum(bai1) > sum(bai2)

def random_emoji():
    """Random emoji cho vui"""
    emojis = ["🎉", "😎", "🔥", "💪", "😆", "🎊", "🤩", "🥳", "✨", "🌟"]
    return random.choice(emojis)

# ===== BOT EVENTS =====
@bot.event
async def on_ready():
    print(f"✅ Bot: {bot.user} | Prefix: {PREFIX}")
    print("🎮 Các lệnh game đã sẵn sàng!")

# ===== COMMANDS =====
@bot.command(name="dangkytk")
async def dang_ky(ctx):
    """Đăng ký tài khoản nhận 1 củ"""
    data = load_data()
    user_id = str(ctx.author.id)
    
    if user_id in data:
        await ctx.send("❌ Bạn đã có tài khoản rồi!")
        return
    
    data[user_id] = {
        "balance": 1000000,
        "last_daily": None,
        "games_played": 0
    }
    save_data(data)
    await ctx.send(f"✅ Đăng ký thành công! Bạn nhận được **1,000,000 VND** {random_emoji()}")

@bot.command(name="myzalopay")
async def check_balance(ctx):
    """Kiểm tra số dư"""
    data = load_data()
    user_id = str(ctx.author.id)
    
    if user_id not in data:
        await ctx.send("❌ Bạn chưa đăng ký tài khoản! Dùng `?dangkytk` để đăng ký.")
        return
    
    balance = data[user_id].get("balance", 0)
    await ctx.send(f"💰 **Số dư của bạn:** {balance:,} VND")

@bot.command(name="daily")
async def daily_reward(ctx):
    """Điểm danh nhận lương ngày (100k/ngày)"""
    data = load_data()
    user_id = str(ctx.author.id)
    
    if user_id not in data:
        await ctx.send("❌ Bạn chưa đăng ký tài khoản! Dùng `?dangkytk` để đăng ký.")
        return
    
    last_daily = data[user_id].get("last_daily")
    if last_daily:
        last_time = datetime.fromisoformat(last_daily)
        if datetime.now() - last_time < timedelta(days=1):
            next_time = last_time + timedelta(days=1)
            await ctx.send(f"⏰ Bạn đã nhận lương hôm nay rồi! Quay lại sau **{next_time.strftime('%H:%M %d/%m/%Y')}**")
            return
    
    data[user_id]["balance"] = data[user_id].get("balance", 0) + 100000
    data[user_id]["last_daily"] = datetime.now().isoformat()
    save_data(data)
    await ctx.send(f"✅ Điểm danh thành công! Bạn nhận được **100,000 VND** {random_emoji()}")

@bot.command(name="baicao")
async def bai_cao(ctx):
    """Đánh bài cào"""
    data = load_data()
    user_id = str(ctx.author.id)
    
    if user_id not in data:
        await ctx.send("❌ Bạn chưa đăng ký tài khoản! Dùng `?dangkytk` để đăng ký.")
        return
    
    # Bot và người chơi mỗi bên 3 lá
    player_cards = tao_bai()
    bot_cards = tao_bai()
    
    player_score = tinh_diem_bai_cao(player_cards)
    bot_score = tinh_diem_bai_cao(bot_cards)
    
    # Format hiển thị
    player_show = " ".join([str(c) for c in player_cards])
    bot_show = " ".join([str(c) for c in bot_cards])
    
    result = ""
    if player_score > bot_score:
        reward = 50000
        data[user_id]["balance"] += reward
        result = f"🎉 **Bạn thắng!** Nhận {reward:,} VND"
    elif player_score < bot_score:
        data[user_id]["balance"] -= 50000
        result = f"😅 **Bạn thua!** Mất 50,000 VND"
    else:
        result = "🤝 **Hòa!**"
    
    data[user_id]["games_played"] = data[user_id].get("games_played", 0) + 1
    save_data(data)
    
    await ctx.send(
        f"**🎴 BÀI CÀO**\n"
        f"👤 Bạn: {player_show} (Điểm: {player_score})\n"
        f"🤖 Bot: {bot_show} (Điểm: {bot_score})\n"
        f"**{result}**"
    )

@bot.command(name="xizach")
async def xi_dach(ctx):
    """Đánh bài xì dách"""
    data = load_data()
    user_id = str(ctx.author.id)
    
    if user_id not in data:
        await ctx.send("❌ Bạn chưa đăng ký tài khoản! Dùng `?dangkytk` để đăng ký.")
        return
    
    # Người chơi 2 lá, bot 2 lá
    player_cards = random.sample(range(1, 12), 2)
    bot_cards = random.sample(range(1, 12), 2)
    
    # Thêm khả năng rút thêm (người chơi)
    if random.random() < 0.3:
        player_cards.append(random.randint(1, 11))
    if random.random() < 0.3:
        bot_cards.append(random.randint(1, 11))
    
    player_score = tinh_diem_xizach(player_cards)
    bot_score = tinh_diem_xizach(bot_cards)
    
    player_show = " ".join([str(c) for c in player_cards])
    bot_show = " ".join([str(c) for c in bot_cards])
    
    result = ""
    if player_score > 21:
        data[user_id]["balance"] -= 50000
        result = f"💀 **Bạn quắc!** Mất 50,000 VND"
    elif bot_score > 21:
        reward = 50000
        data[user_id]["balance"] += reward
        result = f"🎉 **Bot quắc!** Bạn thắng {reward:,} VND"
    elif player_score > bot_score:
        reward = 50000
        data[user_id]["balance"] += reward
        result = f"🎉 **Bạn thắng!** Nhận {reward:,} VND"
    elif player_score < bot_score:
        data[user_id]["balance"] -= 50000
        result = f"😅 **Bạn thua!** Mất 50,000 VND"
    else:
        result = "🤝 **Hòa!**"
    
    data[user_id]["games_played"] = data[user_id].get("games_played", 0) + 1
    save_data(data)
    
    await ctx.send(
        f"**🃏 XÌ DÁCH**\n"
        f"👤 Bạn: {player_show} (Điểm: {player_score})\n"
        f"🤖 Bot: {bot_show} (Điểm: {bot_score})\n"
        f"**{result}**"
    )

