def get_cookies():
    """Lấy cookies từ trình duyệt (Chrome/Edge/Firefox) để xác thực YouTube."""
    try:
        # Ưu tiên Chrome
        cookies = browser_cookie3.chrome(domain_name='.youtube.com')
        if cookies:
            print("✅ Đã lấy cookies từ Chrome")
            return cookies
    except:
        pass
    try:
        cookies = browser_cookie3.edge(domain_name='.youtube.com')
        if cookies:
            print("✅ Đã lấy cookies từ Edge")
            return cookies
    except:
        pass
    try:
        cookies = browser_cookie3.firefox(domain_name='.youtube.com')
        if cookies:
            print("✅ Đã lấy cookies từ Firefox")
            return cookies
    except:
        pass
    print("⚠️ Không thể lấy cookies từ trình duyệt. Yêu cầu xác thực YouTube có thể thất bại.")
