# ===== UTILITIES (MUSIC) =====
def is_spotify_url(url):
    return 'open.spotify.com' in url or 'spotify.com' in url

def is_youtube_url(url):
    return 'youtube.com' in url.lower() or 'youtu.be' in url.lower()

def get_spotify_track_info(url):
    if sp is None:
        return []
    try:
        if 'track' in url:
            track = sp.track(url)
            return [{'name': f"{track['name']} - {track['artists'][0]['name']}",
                     'query': f"{track['name']} {track['artists'][0]['name']}"}]
        elif 'playlist' in url:
            playlist_id = url.split('/')[-1].split('?')[0]
            results = sp.playlist_tracks(playlist_id)
            tracks = []
            for item in results['items']:
                t = item['track']
                if t:
                    tracks.append({'name': f"{t['name']} - {t['artists'][0]['name']}",
                                   'query': f"{t['name']} {t['artists'][0]['name']}"})
            return tracks
        elif 'album' in url:
            album_id = url.split('/')[-1].split('?')[0]
            album = sp.album(url)
            artist = album['artists'][0]['name']
            results = sp.album_tracks(album_id)
            return [{'name': f"{track['name']} - {artist}",
                     'query': f"{track['name']} {artist}"} for track in results['items']]
    except Exception as e:
        print(f"Spotify error: {e}")
    return []

def search_spotify(query):
    if sp is None:
        return None
    try:
        results = sp.search(q=query, type='track', limit=5)
        if results['tracks']['items']:
            t = results['tracks']['items'][0]
            return {'name': f"{t['name']} - {t['artists'][0]['name']}",
                    'query': f"{t['name']} {t['artists'][0]['name']}"}
    except Exception as e:
        print(f"Spotify search error: {e}")
    return None

def search_youtube(query, prefer_audio=True):
    try:
        artist = None
        title = query
        if " - " in query:
            parts = query.split(" - ", 1)
            title = parts[0].strip()
            artist = parts[1].strip()
        elif " – " in query:
            parts = query.split(" – ", 1)
            title = parts[0].strip()
            artist = parts[1].strip()

        search_queries = []
        if artist:
            search_queries.append(f"{title} - {artist} official audio")
            search_queries.append(f"{title} - {artist} audio")
            search_queries.append(f"{title} - {artist} lyrics")
            search_queries.append(f"{title} {artist} official")
        else:
            search_queries.append(f"{query} official audio")
            search_queries.append(f"{query} audio")
            search_queries.append(f"{query} lyrics")

        search_queries.append(query)

        hard_blacklist = [
            'âm ly', 'loa', 'bãi', 'amply', 'amplifier', 'speaker', 'subwoofer',
            'thùng', 'cục đẩy', 'mic', 'microphone', 'dàn karaoke',
            'đồ cũ', 'thanh lý', 'giá rẻ', 'mới 100%', 'zin 100%',
            'audio shop', 'audio store', 'bán loa', 'bán amply',
            'test loa', 'bass 30', 'bass 40', 'rap việt', 'performance'
        ]

        ydl_opts = {
            'format': 'bestaudio/best',
            'quiet': True,
            'no_warnings': True,
            'extract_flat': True,
            'ignoreerrors': True,
            'user_agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
        }

        # Thêm cookies nếu có
        if cookies:
            ydl_opts['cookiefile'] = cookies

        for search_query in search_queries:
            with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                info = ydl.extract_info(f"ytsearch20:{search_query}", download=False)
                if not info or not info.get('entries'):
                    continue
                entries = info['entries']

                filtered = [e for e in entries if e.get('duration') and 90 <= e['duration'] <= 360]
                if not filtered:
                    filtered = [e for e in entries if e.get('duration') and 60 <= e['duration'] <= 480]
                if not filtered:
                    filtered = entries

                clean = []
                for e in filtered:
                    title_lower = e.get('title', '').lower()
                    if any(word in title_lower for word in hard_blacklist):
                        continue
                    clean.append(e)

                if not clean:
                    continue

                best_score = -1
                best_match = None
                title_words = re.sub(r'[^\w\s]', '', title.lower()).split()
                artist_words = []
                if artist:
                    artist_words = re.sub(r'[^\w\s]', '', artist.lower()).split()

                for e in clean:
                    title_lower = e.get('title', '').lower()
                    score = 0
                    if title_words:
                        match_count = sum(1 for w in title_words if w in title_lower)
                        score += match_count * 3
                    if artist_words:
                        match_count = sum(1 for w in artist_words if w in title_lower)
                        score += match_count * 2
                    if 'official' in title_lower:
                        score += 2
                    if 'audio' in title_lower or 'lyrics' in title_lower:
                        score += 1
                    if len(title_lower.split()) < 10:
                        score += 0.5

                    if score > best_score:
                        best_score = score
                        best_match = e

                if best_match:
                    duration = best_match.get('duration')
                    print(f"✅ Chọn video: {best_match.get('title')} ({duration}s, score={best_score})")
                    return {
                        'name': best_match.get('title', 'Unknown'),
                        'url': f"https://www.youtube.com/watch?v={best_match.get('id')}",
                        'duration': duration
                    }

        return None
    except Exception as e:
        print(f"YouTube search error: {e}")
        return None

async def download_and_cache(url, track_name, duration=None):
    try:
        safe = re.sub(r'[^\w\s-]', '', track_name)[:50]
        filename = f"audio_cache/{safe.replace(' ', '_')}.mp3"
        if os.path.exists(filename):
            return

        if duration and duration > 600:
            print(f"❌ Video quá dài ({duration}s), bỏ qua.")
            return

        print(f"⬇️ Đang cache: {safe}")
        ydl_opts = {
            'format': 'bestaudio[ext=m4a]/bestaudio/best',
            'postprocessors': [{
                'key': 'FFmpegExtractAudio',
                'preferredcodec': 'mp3',
                'preferredquality': '192',
            }],
            'outtmpl': f'audio_cache/{safe.replace(" ", "_")}',
            'quiet': True,
            'no_warnings': True,
            'ignoreerrors': True,
            'user_agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
        }

        # Thêm cookies nếu có
        if cookies:
            ydl_opts['cookiefile'] = cookies

        loop = asyncio.get_running_loop()
        with concurrent.futures.ThreadPoolExecutor() as pool:
            await loop.run_in_executor(
                pool,
                lambda: yt_dlp.YoutubeDL(ydl_opts).extract_info(url, download=True)
            )
        print(f"✓ Cache xong: {safe}")
    except Exception as e:
        print(f"Cache error: {e}")

async def play_audio(ctx, track_name, filepath=None):
    try:
        if filepath is None:
            safe = re.sub(r'[^\w\s-]', '', track_name)[:50]
            base = f"audio_cache/{safe.replace(' ', '_')}"
            for ext in ['.mp3', '.m4a', '.webm']:
                if os.path.exists(base + ext):
                    filepath = base + ext
                    break
            if not filepath:
                await ctx.send(f"❌ Không tìm thấy file audio cho {track_name}")
                return
        else:
            if not os.path.exists(filepath):
                await ctx.send(f"❌ File {filepath} không tồn tại.")
                return

        source = discord.FFmpegOpusAudio(filepath)
        def after_playing(error):
            if error:
                print(f"Playback error: {error}")
            asyncio.run_coroutine_threadsafe(play_next_track(ctx), bot.loop)
        ctx.voice_client.play(source, after=after_playing)
    except Exception as e:
        print(f"Playback error: {e}")
        await ctx.send(f"❌ Lỗi phát nhạc: {e}")

async def preload_next_track(guild_id):
    qdata = get_queue(guild_id)
    if qdata['preloading']:
        return
    queue = qdata['queue']
    if not queue:
        return
    next_track = queue[0]
    if qdata['preloaded'] == next_track:
        return
    qdata['preloading'] = True
    try:
        if not next_track.get('is_local'):
            await download_and_cache(next_track['youtube_url'], next_track['name'])
            qdata['preloaded'] = next_track
    except Exception as e:
        print(f"Preload error: {e}")
    finally:
        qdata['preloading'] = False

async def play_next_track(ctx):
    qdata = get_queue(ctx.guild.id)
    queue = qdata['queue']
    loop = qdata['loop_mode']
    current = qdata['current']

    if not queue:
        if loop == 'song' and current:
            queue.append(current.copy())
            await play_next_track(ctx)
            return
        elif loop == 'queue' and qdata['original_queue']:
            queue.extend(qdata['original_queue'])
            await play_next_track(ctx)
            return
        else:
            qdata['current'] = None
            return

    track = queue.pop(0)
    qdata['current'] = track

    if track.get('is_local') and track.get('filepath'):
        await ctx.send(f"🎵 **Đang phát:** {track['name']}")
        await play_audio(ctx, track['name'], filepath=track['filepath'])
    else:
        await download_and_cache(track['youtube_url'], track['name'], track.get('duration'))
        await ctx.send(f"🎵 **Đang phát:** {track['name']}")
        await play_audio(ctx, track['name'])
    asyncio.create_task(preload_next_track(ctx.guild.id))

